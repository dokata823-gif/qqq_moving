name: Update QQQ Chart and Deploy to GitHub Pages

on:
  schedule:
    # 매일 UTC 22:00 (한국 시간 오전 7:00, 미국장 마감 후) 자동 업데이트
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # GitHub 웹에서 수동 실행 버튼 지원
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch latest QQQ data and build static HTML
        run: |
          python export_html.py
          cp qqq_monthly_chart.html index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
