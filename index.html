<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QQQ 60월선 대비 종가 상승률 차트</title>
    <!-- TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --card-border: #232a3b;
            --text-main: #f0f4f8;
            --text-sub: #8b98a5;
            --accent-green: #00e676;
            --accent-red: #ff5252;
            --accent-lightning: #e040fb;
            --accent-fire: #ff9100;
            --ma-color: #ffb300;
            --candle-up: #089981;
            --candle-down: #f23645;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Top Header */
        header {
            padding: 12px 16px;
            background: linear-gradient(180deg, #181e2b 0%, #11151f 100%);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ticker-badge {
            background: #2563eb;
            color: #ffffff;
            font-weight: 800;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .header-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-sub {
            font-size: 11px;
            color: var(--text-sub);
        }

        .refresh-btn {
            background: #1e2638;
            border: 1px solid #2e3b55;
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .refresh-btn:active {
            transform: scale(0.95);
            background: #2d384e;
        }

        /* Metrics Display Panel */
        .metrics-panel {
            padding: 12px 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .metrics-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .target-date {
            font-size: 12px;
            color: var(--text-sub);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .target-date .tag {
            background: rgba(255, 179, 0, 0.15);
            color: var(--ma-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
        }

        .target-date .hot-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
        }

        .target-date .hot-tag.fire {
            background: rgba(255, 145, 0, 0.2);
            color: #ff9100;
            border: 1px solid rgba(255, 145, 0, 0.4);
        }

        .target-date .hot-tag.lightning {
            background: rgba(224, 64, 251, 0.2);
            color: #e040fb;
            border: 1px solid rgba(224, 64, 251, 0.4);
        }

        /* Main Metric Badge */
        .main-stat-badge {
            padding: 6px 14px;
            border-radius: 8px;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
        }

        .main-stat-badge.plus {
            background: rgba(0, 230, 118, 0.15);
            border: 1px solid rgba(0, 230, 118, 0.35);
            color: var(--accent-green);
        }

        .main-stat-badge.fire {
            background: rgba(255, 145, 0, 0.2);
            border: 1px solid rgba(255, 145, 0, 0.5);
            color: #ff9100;
        }

        .main-stat-badge.lightning {
            background: rgba(224, 64, 251, 0.22);
            border: 1px solid rgba(224, 64, 251, 0.55);
            color: #e040fb;
        }

        .main-stat-badge.minus {
            background: rgba(255, 82, 82, 0.15);
            border: 1px solid rgba(255, 82, 82, 0.35);
            color: var(--accent-red);
        }

        .main-stat-badge.na {
            background: rgba(139, 152, 165, 0.12);
            border: 1px solid rgba(139, 152, 165, 0.3);
            color: var(--text-sub);
        }

        .stat-label-mini {
            font-size: 10px;
            opacity: 0.9;
            display: block;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .stat-val-huge {
            font-size: 20px;
            font-weight: 800;
        }

        /* Metric Grid */
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .metric-card {
            background: #0f131a;
            border: 1px solid #1c2331;
            padding: 8px 6px;
            border-radius: 6px;
            text-align: center;
        }

        .metric-card .title {
            font-size: 10px;
            color: var(--text-sub);
            margin-bottom: 3px;
        }

        .metric-card .value {
            font-size: 13px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .ohlc-bar {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-sub);
            background: #0e1219;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .ohlc-bar span b {
            color: var(--text-main);
        }

        /* Chart Area */
        .chart-container-wrap {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 440px;
            background: var(--bg-color);
        }

        #chart {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Completely hide TradingView logo watermark */
        #chart a, 
        #chart svg[class*="watermark"], 
        #chart [class*="watermark"],
        a[href*="tradingview.com"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Bottom Controls */
        .bottom-toolbar {
            padding: 10px 16px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-range-group {
            display: flex;
            gap: 6px;
        }

        .time-btn {
            background: #11151f;
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .time-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
        }

        .legend-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            color: var(--text-sub);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .legend-color {
            width: 8px;
            height: 3px;
            border-radius: 2px;
        }

        /* Loading Overlay */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 14, 20, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            gap: 12px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(37, 99, 235, 0.2);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title-wrap">
            <span class="ticker-badge">QQQ</span>
            <div>
                <div class="header-title">월봉 60선 대비 종가 상승률</div>
                <div class="header-sub" id="last-updated-text">실시간 데이터 로딩 중...</div>
            </div>
        </div>
        <button class="refresh-btn" id="btn-refresh" onclick="location.reload(true)">
            <span>🔄</span> 새로고침
        </button>
    </header>

    <!-- Interactive Metrics Panel -->
    <section class="metrics-panel">
        <div class="metrics-top-row">
            <div>
                <div class="target-date" id="disp-date">
                    <span class="tag">선택 월봉</span>
                    <span id="val-date">--</span>
                    <span id="val-hot-tag"></span>
                </div>
                <div style="font-size: 22px; font-weight: 800; font-family: 'JetBrains Mono', monospace; margin-top: 4px;" id="val-close-price">
                    $0.00
                </div>
            </div>
            <!-- Main requested ratio: 60월봉 대비 종가 상승률 -->
            <div class="main-stat-badge na" id="disparity-badge">
                <span class="stat-label-mini" id="label-stat-title">60선 대비 상승률 (종가/60MA - 1)</span>
                <span class="stat-val-huge" id="val-growth-pct">--%</span>
            </div>
        </div>

        <!-- Metric Details Grid -->
        <div class="metric-grid">
            <div class="metric-card">
                <div class="title">60월 이동평균</div>
                <div class="value" style="color: var(--ma-color);" id="val-ma60">--</div>
            </div>
            <div class="metric-card">
                <div class="title">주가 차이 ($)</div>
                <div class="value" id="val-diff-dollar">--</div>
            </div>
            <div class="metric-card">
                <div class="title">계산 비율 (배수)</div>
                <div class="value" id="val-multiple">--</div>
            </div>
        </div>

        <!-- OHLC Summary -->
        <div class="ohlc-bar">
            <span>시 <b>$<span id="val-open">--</span></b></span>
            <span>고 <b style="color: var(--candle-up);">$<span id="val-high">--</span></b></span>
            <span>저 <b style="color: var(--candle-down);">$<span id="val-low">--</span></b></span>
            <span>종 <b>$<span id="val-close">--</span></b></span>
        </div>
    </section>

    <!-- Main Chart Section -->
    <main class="chart-container-wrap">
        <div id="chart"></div>

        <div id="loading">
            <div class="spinner"></div>
            <span style="font-size: 13px; color: var(--text-sub);">QQQ 월봉 데이터 수집 및 60선 계산 중...</span>
        </div>
    </main>

    <!-- Bottom Toolbar -->
    <footer class="bottom-toolbar">
        <div class="time-range-group">
            <button class="time-btn" onclick="setRange('all')">전체</button>
            <button class="time-btn" onclick="setRange('10y')">10년</button>
            <button class="time-btn" onclick="setRange('5y')">5년</button>
            <button class="time-btn active" onclick="fitChart()">자동맞춤</button>
        </div>
        <div class="legend-indicator">
            <div class="legend-item">
                <span>🔥 50%+</span>
            </div>
            <div class="legend-item">
                <span>⚡ 60%+</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: var(--ma-color); height: 2px;"></div>
                <span>60MA</span>
            </div>
        </div>
    </footer>

    <script>
        let chart = null;
        let candleSeries = null;
        let ma60Series = null;
        let statsMap = {};
        let rawData = null;
        let latestStat = null;

        function initChart() {
            const chartContainer = document.getElementById('chart');
            
            chart = LightweightCharts.createChart(chartContainer, {
                layout: {
                    background: { color: '#0b0e14' },
                    textColor: '#8b98a5',
                    fontSize: 11,
                    fontFamily: 'JetBrains Mono, Pretendard, sans-serif',
                },
                grid: {
                    vertLines: { color: '#161d28', style: LightweightCharts.LineStyle.Dotted },
                    horzLines: { color: '#161d28', style: LightweightCharts.LineStyle.Dotted },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: {
                        color: '#ffb300',
                        width: 1,
                        style: LightweightCharts.LineStyle.Dashed,
                        labelBackgroundColor: '#ffb300',
                    },
                    horzLine: {
                        color: '#2563eb',
                        width: 1,
                        style: LightweightCharts.LineStyle.Dashed,
                        labelBackgroundColor: '#2563eb',
                    },
                },
                rightPriceScale: {
                    borderColor: '#232a3b',
                    scaleMargins: {
                        top: 0.12,
                        bottom: 0.15,
                    },
                },
                timeScale: {
                    borderColor: '#232a3b',
                    timeVisible: true,
                    secondsVisible: false,
                    fixLeftEdge: true,
                    fixRightEdge: true,
                },
                handleScroll: {
                    vertTouchDrag: false,
                },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#089981',
                downColor: '#f23645',
                borderUpColor: '#089981',
                borderDownColor: '#f23645',
                wickUpColor: '#089981',
                wickDownColor: '#f23645',
            });

            ma60Series = chart.addLineSeries({
                color: '#ffb300',
                lineWidth: 2.5,
                title: '60M MA',
                priceLineVisible: false,
                lastValueVisible: false,
            });

            chart.subscribeCrosshairMove(param => {
                if (!param || !param.time) {
                    if (latestStat) updatePanel(latestStat);
                    return;
                }
                const timeStr = typeof param.time === 'string' ? param.time : `${param.time.year}-${String(param.time.month).padStart(2,'0')}-${String(param.time.day).padStart(2,'0')}`;
                const stat = statsMap[timeStr];
                if (stat) {
                    updatePanel(stat);
                }
            });

            window.addEventListener('resize', () => {
                if (chart) {
                    chart.applyOptions({
                        width: chartContainer.clientWidth,
                        height: chartContainer.clientHeight
                    });
                }
            });

            // Clean up TradingView logo if dynamically inserted
            const removeLogo = () => {
                const links = chartContainer.querySelectorAll('a, svg[class*="watermark"], [class*="watermark"]');
                links.forEach(el => el.remove());
            };
            setTimeout(removeLogo, 100);
            setTimeout(removeLogo, 500);
            setTimeout(removeLogo, 1500);
        }

        function updatePanel(stat) {
            document.getElementById('val-date').textContent = stat.time;
            document.getElementById('val-close-price').textContent = `$${stat.close.toFixed(2)}`;
            document.getElementById('val-open').textContent = stat.open.toFixed(2);
            document.getElementById('val-high').textContent = stat.high.toFixed(2);
            document.getElementById('val-low').textContent = stat.low.toFixed(2);
            document.getElementById('val-close').textContent = stat.close.toFixed(2);

            const badge = document.getElementById('disparity-badge');
            const growthPctEl = document.getElementById('val-growth-pct');
            const ma60El = document.getElementById('val-ma60');
            const diffDollarEl = document.getElementById('val-diff-dollar');
            const multipleEl = document.getElementById('val-multiple');
            const hotTagEl = document.getElementById('val-hot-tag');

            if (stat.ma60 !== null && stat.ma60 !== undefined) {
                ma60El.textContent = `$${stat.ma60.toFixed(2)}`;
                
                const diff = stat.diff;
                const sign = diff >= 0 ? '+' : '';
                diffDollarEl.textContent = `${sign}$${diff.toFixed(2)}`;
                diffDollarEl.style.color = diff >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
                
                // Growth %: (Close / MA60 - 1) * 100
                const gVal = stat.growth_pct;
                const gSign = gVal >= 0 ? '+' : '';
                growthPctEl.textContent = `${gSign}${gVal.toFixed(2)}%`;

                const multiple = (stat.close / stat.ma60).toFixed(2);
                multipleEl.textContent = `${multiple}x`;

                if (gVal >= 60.0) {
                    badge.className = 'main-stat-badge lightning';
                    growthPctEl.textContent = `⚡ ${gSign}${gVal.toFixed(2)}%`;
                    hotTagEl.className = 'hot-tag lightning';
                    hotTagEl.textContent = '⚡ 60%+';
                } else if (gVal >= 50.0) {
                    badge.className = 'main-stat-badge fire';
                    growthPctEl.textContent = `🔥 ${gSign}${gVal.toFixed(2)}%`;
                    hotTagEl.className = 'hot-tag fire';
                    hotTagEl.textContent = '🔥 50%+';
                } else {
                    badge.className = 'main-stat-badge ' + (gVal >= 0 ? 'plus' : 'minus');
                    hotTagEl.className = '';
                    hotTagEl.textContent = '';
                }
            } else {
                ma60El.textContent = '60개월 이전';
                diffDollarEl.textContent = '--';
                diffDollarEl.style.color = 'var(--text-sub)';
                multipleEl.textContent = '--';
                growthPctEl.textContent = 'N/A';
                badge.className = 'main-stat-badge na';
                hotTagEl.className = '';
                hotTagEl.textContent = '';
            }
        }

        async function reloadData(force = false) {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';
            try {
                const res = await fetch(`/api/data${force ? '?force=true' : ''}`);
                const json = await res.json();
                if (json.status === 'success') {
                    renderData(json.data);
                } else {
                    alert('데이터 로딩 실패: ' + json.message);
                }
            } catch (err) {
                console.error(err);
                alert('서버 연결 오류가 발생했습니다.');
            } finally {
                loading.style.display = 'none';
            }
        }

        function renderData(data) {
            rawData = data;
            document.getElementById('last-updated-text').textContent = `최근 갱신: ${data.last_updated}`;

            statsMap = {};
            const markers = [];

            data.stats.forEach(s => {
                statsMap[s.time] = s;
                if (s.growth_pct !== null && s.growth_pct !== undefined) {
                    if (s.growth_pct >= 60.0) {
                        markers.push({
                            time: s.time,
                            position: 'aboveBar',
                            color: '#e040fb',
                            shape: 'circle',
                            text: '⚡',
                            size: 1
                        });
                    } else if (s.growth_pct >= 50.0) {
                        markers.push({
                            time: s.time,
                            position: 'aboveBar',
                            color: '#ff9100',
                            shape: 'circle',
                            text: '🔥',
                            size: 1
                        });
                    }
                }
            });

            candleSeries.setData(data.candles);
            candleSeries.setMarkers(markers);
            ma60Series.setData(data.ma60);

            if (data.stats.length > 0) {
                latestStat = data.stats[data.stats.length - 1];
                updatePanel(latestStat);
            }

            fitChart();
        }

        function fitChart() {
            if (chart) {
                chart.timeScale().fitContent();
            }
        }

        function setRange(range) {
            if (!rawData || !rawData.candles || rawData.candles.length === 0) return;
            const len = rawData.candles.length;
            let fromIndex = 0;
            if (range === '5y') {
                fromIndex = Math.max(0, len - 60);
            } else if (range === '10y') {
                fromIndex = Math.max(0, len - 120);
            } else {
                fromIndex = 0;
            }
            const fromTime = rawData.candles[fromIndex].time;
            const toTime = rawData.candles[len - 1].time;
            chart.timeScale().setVisibleRange({
                from: fromTime,
                to: toTime
            });
        }

        window.onload = () => {
            initChart();
            reloadData(false);
        };
